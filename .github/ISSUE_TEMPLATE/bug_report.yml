name: Bug report
description: Something didn't install or didn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which AI tool?
      options: [Claude Code, Google Antigravity, OpenCode, VS Code + Copilot, Cursor, OpenAI Codex, Gemini CLI, Windsurf / Devin, Other]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [npx skills add, Claude Code plugin, install.sh, install.ps1, Manual copy]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / macOS 15 / Ubuntu 24.04
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Please remove any real API keys or secrets before pasting output.
    validations:
      required: true
